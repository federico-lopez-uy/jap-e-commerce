<!DOCTYPE html>
<html lang="es">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>eMercado - Todo lo que busques está aquí</title>

    <link
      href="https://fonts.googleapis.com/css?family=Raleway:300,300i,400,400i,700,700i,900,900i"
      rel="stylesheet"
    />
    <link href="css/font-awesome.min.css" rel="stylesheet" />
    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark p-1">
      <div class="container">
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav w-100 justify-content-between">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="categories.html">Categorías</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="sell.html">Vender</a>
            </li>
            <li class="nav-item"></li>
          </ul>
        </div>
      </div>
    </nav>
    <main>
      <section class="product-container">
        <section class="images">
          <aside>
            <ul id="side-images"></ul>
          </aside>

          <section class="main-image-wrapper">
            <img id="main-image"></img>
            <div class="zoom">🔍</div>
            <div class="arrows">
              <span>&lt;</span>
              <span>&gt;</span>
            </div>
          </section>
        </section>
      

        <section class="details">
          <h2 id="product-name"></h2>
          <h3 id="product-category"></h3>
          <p class="description" id="product-description"></p>
          <p class="price" id="product-cost"></p>
          <button class="add-cart">Agregar al carrito ➕</button>
          <p class="sold" id="product-sold-count"></p>
        </section>
      </section>

      <section class="comments-container"></section>

      <div class="container mt-5">
        <div id="nueva-calificacion" class="p-4 border rounded bg-white shadow-sm">
            <h3 class="mb-3">Deja tu calificación</h3>

            <form id="form-calificacion">
                <!-- Campo para el comentario -->
                <div class="mb-3">
                    <label for="comentario" class="form-label">Tu comentario</label>
                    <textarea id="comentario" name="comentario" class="form-control" rows="3"
                        placeholder="Escribe aquí tu opinión..." required></textarea>
                </div>

                <!-- Calificación con estrellas -->
                <div class="mb-3 text-center">
                    <label class="form-label">Tu calificación</label>
                    <div class="star-rating">
                      <section>
                        <input type="radio" id="star1" name="calificacion" value="1" required>
                        <label for="star1" data-stars="1"></label>
                      </section>
                      <section>
                        <input type="radio" id="star2" name="calificacion" value="2" required>
                        <label for="star2" data-stars="2"></label>
                      </section>
                      <section>
                        <input type="radio" id="star3" name="calificacion" value="3" required>
                        <label for="star3" data-stars="3"></label>
                      </section>
                      <section>
                        <input type="radio" id="star4" name="calificacion" value="4" required>
                        <label for="star4" data-stars="4"></label>
                      </section>
                      <section>
                        <input type="radio" id="star5" name="calificacion" value="5" required>
                        <label for="star5" data-stars="5"></label>
                      </section>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Enviar</button>
            </form>
        </div>

        <!-- Sección para mostrar comentarios -->
        <div id="lista-comentarios" class="mt-4">
            <h3>Comentarios</h3>
            <ul class="list-group" id="comentarios-ul"></ul>
        </div>
      </div>          
    </main>

    <footer class="text-muted">
      <div class="container">
        <p class="float-end">
          <a href="#">Volver arriba</a>
        </p>
        <p>
          Este sitio forma parte de
          <a href="https://jovenesaprogramar.edu.uy/" target="_blank"
            >Jovenes a Programar</a
          >
        </p>
      </div>
    </footer>
    <div id="spinner-wrapper">
      <div class="lds-ring">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/init.js"></script>
    <script src="js/product-info.js"></script>
  </body>
</html>
