<!DOCTYPE html>
<html lang="es">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>eMercado - Todo lo que busques está aquí</title>

  <link href="https://fonts.googleapis.com/css?family=Raleway:300,300i,400,400i,700,700i,900,900i" rel="stylesheet">
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
  <style>
    body {
      background-color: rgb(248, 249, 250);
    }
  </style>
</head>

<body>
  <main>
    <section id="login">
      <div class="login-container">
        <div class="login-panel left-panel">
          <div class="logo-small">
            <img src="img/logo.png" alt="logo" width="200px">
            
          </div>

          <div class="form-content">
            <h1 id="login-title">Sign Up</h1>
            <p class="account-prompt">¿Ya tienes una cuenta? <a href="/login.html" class="create-account-link">¡Inicia sesión!</a></p>

            <form>
              <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
              </div>

              <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
              </div>

              <div class="form-group">
                <label for="password">Confirmación</label>
                <input type="password" id="password2" name="password2" required>
              </div>


              <button type="submit" class="register-button">Registrarme</button>
            </form>
          </div>
        </div>
        <div class="login-panel right-panel">
          <div class="logo-large">
            <img src="img/logo-blanco.png" alt="">
          </div>
        </div>
    </section>


  </main>
  <script src="js/register.js"></script>
</body>

</html>
