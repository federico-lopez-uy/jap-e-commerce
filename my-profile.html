    <div class="container">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">

  <main>
    <div class="personal-data-form">
        <h1 class="titulo">DATOS PERSONALES</h1>

        <div class="photo-section">
            <div class="photo-placeholder">
            </div>
            <span class="cambiar-foto">Agregar/Cambiar foto</span>
        </div>

        <form class="form-fields">
            <div class="campo-texto">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" class="input-linea" required>
            </div>
            
            <div class="campo-texto">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" class="input-linea" required>
            </div>

            <div class="campo-texto">
                <label for="email">Email</label>
                <input type="email" id="email" class="input-linea" required>
            </div>

            <div class="campo-texto">
                <label for="telefono">Teléfono de contacto</label>
                <input type="tel" id="telefono" class="input-linea" required>
            </div>
        </form>

        <button class="actualizar-button">Click para actualizar información</button>
    </div>

  </main>
  <footer class="text-muted">
    <div class="container">
      <p class="float-end">
